<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio DJ Studio - אולפן שידור מקצועי</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --panel-border: #334155;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-color: #f8fafc;
      --text-dim: #94a3b8;
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      direction: rtl;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--panel-bg);
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .live-clock {
      font-size: 1.3rem;
      font-family: monospace;
      font-weight: bold;
      background: #0f172a;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      color: var(--accent-color);
    }

    .status-badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      background: var(--danger-color);
      color: white;
      letter-spacing: 1px;
    }

    .status-badge.on-air {
      background: var(--success-color);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
    }

    .main-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    .mic-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    .mic-btn.active {
      background: var(--danger-color);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h3 {
      color: var(--accent-color);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 8px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .action-btn:hover { background: #475569; }

    textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--panel-border);
      color: white;
      padding: 10px;
      border-radius: 6px;
      outline: none;
      resize: vertical;
    }

    .control-group { margin-top: 5px; }
    .control-group label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 5px; }
    .slider { width: 100%; accent-color: var(--accent-color); }

    /* פלייליסט ותור השמעה */
    .playlist-controls {
      display: flex;
      gap: 10px;
    }

    .file-upload-btn {
      flex: 1;
      background: #0284c7;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .queue-list {
      list-style: none;
      max-height: 150px;
      overflow-y: auto;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
    }

    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #1e293b;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .queue-item.active {
      background: #1e3a5f;
      color: var(--accent-color);
      font-weight: bold;
    }

    .remove-btn {
      background: none;
      border: none;
      color: var(--danger-color);
      cursor: pointer;
      font-weight: bold;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-section">
      <div class="live-clock" id="clock">00:00:00</div>
      <div>
        <h2>📻 Radio DJ Studio - אולפן שידור</h2>
        <p style="font-size: 0.8rem; color: var(--text-dim);">ניהול שידור חי, מיקרופון, פלייליסט וקריין AI</p>
      </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: center;">
      <button class="mic-btn" id="micBtn" onclick="toggleMicrophone()">🎙️ דבר (מיקרופון כבוי)</button>
      <button class="main-btn" id="toggleStreamBtn" onclick="toggleMainStream()">הפעל/כבה שידור ראשי</button>
      <div id="airStatus" class="status-badge">OFF AIR 🔴</div>
    </div>
  </header>

  <div class="grid-container">

    <!-- 1. נגן מוזיקה ותור השמעה משודרג -->
    <div class="card">
      <h3>🎵 נגן מוזיקה ותור השמעה</h3>
      
      <div class="playlist-controls">
        <label class="file-upload-btn">
          ➕ הוסף שירים לתור
          <input type="file" id="musicInput" accept="audio/*" multiple style="display: none;" onchange="loadMusicFiles(this)">
        </label>
        <button class="action-btn" style="background: #0284c7;" onclick="nextTrack()">⏭️ השיר הבא</button>
      </div>

      <audio id="audioPlayer" controls style="width: 100%;"></audio>

      <div class="control-group">
        <label>עוצמת מוזיקה ברקע:</label>
        <input type="range" class="slider" id="musicVol" min="0" max="1" step="0.1" value="0.8" oninput="setVolume(this.value)">
      </div>

      <div class="toggle-group">
        <span style="font-size: 0.85rem;">📉 הנמכה אוטומטית בדיבור (Ducking):</span>
        <input type="checkbox" id="duckingToggle" checked>
      </div>

      <label style="font-size: 0.85rem; color: var(--text-dim);">תור השמעה:</label>
      <ul class="queue-list" id="queueDisplay">
        <li class="queue-item" style="color: var(--text-dim);">אין שירים בתור...</li>
      </ul>
    </div>

    <!-- 2. קריין AI -->
    <div class="card">
      <h3>🎙️ קריין AI רדיופוני</h3>
      <textarea id="aiText" rows="3" placeholder="כתוב כאן מה שהקריין יגיד בלייב..."></textarea>
      
      <div class="control-group">
        <label>מהירות דיבור:</label>
        <input type="range" id="speechRate" class="slider" min="0.5" max="1.5" step="0.1" value="1">
      </div>
      
      <button class="action-btn" style="background: #10b981; width: 100%; margin-top: 5px;" onclick="speakAI()">🎙️ שדר כעת</button>
    </div>

    <!-- 3. אפקטים וסאונד -->
    <div class="card">
      <h3>👏 אפקטים וסצינות</h3>
      <div class="btn-grid">
        <button class="action-btn" onclick="playSound('applause')">👏 מחיאות כפיים</button>
        <button class="action-btn" onclick="playSound('jingle')">🎷 ג'ינגל פתיחה</button>
        <button class="action-btn" onclick="playSound('laugh')">😄 צחוק קהל</button>
        <button class="action-btn" onclick="playSound('siren')">📢 צפירת רדיו</button>
      </div>
    </div>

  </div>

  <script>
    // --- שעון בלייב ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- משתנים גלובליים ---
    let isLive = false;
    let isMicOn = false;
    let micStream = null;
    const playlist = [];
    let currentIndex = -1;

    const audioPlayer = document.getElementById('audioPlayer');
    const queueDisplay = document.getElementById('queueDisplay');

    // --- מיקרופון + Ducking ---
    async function toggleMicrophone() {
      const micBtn = document.getElementById('micBtn');
      const duckingEnabled = document.getElementById('duckingToggle').checked;

      if (!isMicOn) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          isMicOn = true;
          micBtn.innerText = "🎙️ מדבר כעת! (לחץ לכיבוי)";
          micBtn.classList.add("active");

          if (duckingEnabled) {
            audioPlayer.volume = 0.2;
          }
        } catch (err) {
          alert("לא ניתן לגשת למיקרופון. אנא אשר הרשאות בדפדפן.");
        }
      } else {
        if (micStream) {
          micStream.getTracks().forEach(track => track.stop());
        }
        isMicOn = false;
        micBtn.innerText = "🎙️ דבר (מיקרופון כבוי)";
        micBtn.classList.remove("active");

        if (duckingEnabled) {
          audioPlayer.volume = document.getElementById('musicVol').value;
        }
      }
    }

    // --- הפעלה/כיבוי שידור ראשי ---
    function toggleMainStream() {
      isLive = !isLive;
      const statusBadge = document.getElementById('airStatus');
      const mainBtn = document.getElementById('toggleStreamBtn');

      if (isLive) {
        statusBadge.innerText = "ON AIR 🟢";
        statusBadge.classList.add("on-air");
        mainBtn.style.background = "#16a34a";
      } else {
        statusBadge.innerText = "OFF AIR 🔴";
        statusBadge.classList.remove("on-air");
        mainBtn.style.background = "#dc2626";
      }
    }

    // --- נגן ותור השמעה ---
    function loadMusicFiles(input) {
      const files = Array.from(input.files);
      if (files.length === 0) return;

      files.forEach(file => {
        playlist.push({ name: file.name, url: URL.createObjectURL(file) });
      });

      if (currentIndex === -1 && playlist.length > 0) {
        playTrack(0);
      } else {
        renderQueue();
      }
    }

    function playTrack(index) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      audioPlayer.src = playlist[currentIndex].url;
      audioPlayer.play();
      renderQueue();
    }

    function renderQueue() {
      queueDisplay.innerHTML = '';
      if (playlist.length === 0) {
        queueDisplay.innerHTML = '<li class="queue-item" style="color: var(--text-dim);">אין שירים בתור...</li>';
        return;
      }

      playlist.forEach((track, i) => {
        const li = document.createElement('li');
        li.className = `queue-item ${i === currentIndex ? 'active' : ''}`;
        li.innerHTML = `
          <span>${i + 1}. ${track.name}</span>
          <button class="remove-btn" onclick="removeTrack(${i}, event)">✖</button>
        `;
        li.onclick = () => playTrack(i);
        queueDisplay.appendChild(li);
      });
    }

    function removeTrack(index, event) {
      event.stopPropagation();
      playlist.splice(index, 1);
      if (index === currentIndex) {
        if (playlist.length > 0) playTrack(index % playlist.length);
        else { audioPlayer.src = ''; currentIndex = -1; }
      } else if (index < currentIndex) {
        currentIndex--;
      }
      renderQueue();
    }

    function nextTrack() {
      if (currentIndex + 1 < playlist.length) {
        playTrack(currentIndex + 1);
      }
    }

    audioPlayer.addEventListener('ended', () => {
      if (currentIndex + 1 < playlist.length) {
        playTrack(currentIndex + 1);
      }
    });

    function setVolume(val) {
      if (!isMicOn || !document.getElementById('duckingToggle').checked) {
        audioPlayer.volume = val;
      }
    }

    // --- קריין AI ---
    function speakAI() {
      const text = document.getElementById('aiText').value;
      if (!text) return alert("אנא הכנס טקסט לקריין");
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'he-IL';
      utterance.rate = document.getElementById('speechRate').value;
      window.speechSynthesis.speak(utterance);
    }

    function playSound(type) { alert("אפקט: " + type); }
  </script>

</body>
</html>
