<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio DJ Studio - אולפן שידור</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-live: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; }
    h2 { margin-top: 0; color: #60a5fa; font-size: 1.2em; }
    button {
      background: var(--accent); color: white; border: none; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    .fx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fx-btn { background: #334155; padding: 12px; text-align: center; }
    textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; }
    .msg-list { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; }
    .msg-item { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-right: 3px solid var(--accent); }
    .call-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-right: 3px solid #eab308; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 style="margin:0; font-size: 1.5em;">📻 Radio DJ Studio - אולפן שידור</h1>
      <small style="color: var(--text-dim);">ניהול שידור, אפקטים, שיחות מאזינים בלייב</small>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
      <div id="clock" style="font-size: 1.2em; font-weight: bold;">00:00:00</div>
      <div id="airStatus" style="background:#475569; padding:6px 14px; border-radius:20px; font-weight:bold;">OFF AIR 🔴</div>
    </div>
  </header>

  <!-- נגן אודיו שקוף להשמעת המאזין המחובר -->
  <audio id="remoteAudio" autoplay></audio>

  <div class="grid">
    
    <!-- מרכזיית מאזינים על הקו -->
    <div class="card" style="border: 2px solid #3b82f6;">
      <h2>📞 מרכזיית מאזינים בלייב</h2>
      <div id="callRequestsList">
        <div style="color: var(--text-dim);">ממתין למאזינים שמבקשים לעלות...</div>
      </div>
    </div>

    <!-- בקרת מיקרופון -->
    <div class="card">
      <h2>🎙️ מיקרופון שדרן</h2>
      <button id="micBtn" onclick="toggleMicrophone()" style="width: 100%; padding: 15px; margin-bottom: 10px;">🎙️ דבר (מיקרופון כבוי)</button>
      <label><input type="checkbox" id="duckingToggle" checked> הנמכה אוטומטית בדיבור</label>
    </div>

    <!-- קריין AI -->
    <div class="card">
      <h2>🎙️ קריין AI</h2>
      <textarea id="aiText" rows="2" placeholder="טקסט לקריין..."></textarea>
      <button onclick="speakAI()" style="width: 100%; background: #10b981; margin-top: 8px;">🎙️ שדר כעת</button>
    </div>

    <!-- אפקטים -->
    <div class="card">
      <h2>👏 אפקטים</h2>
      <div class="fx-grid">
        <button class="fx-btn" onclick="playSound('applause')">👏 כפיים</button>
        <button class="fx-btn" onclick="playSound('jingle')">🎷 ג'ינגל</button>
        <button class="fx-btn" onclick="playSound('laugh')">😄 צחוק</button>
        <button class="fx-btn" onclick="playSound('siren')">📢 צפירה</button>
      </div>
    </div>

    <!-- לוח הודעות -->
    <div class="card" style="grid-column: span 2;">
      <h2>💬 הודעות מאזינים</h2>
      <ul id="msgList" class="msg-list"></ul>
    </div>

  </div>

  <script>
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);

    // הגדרת מרכזיית PeerJS
    const STUDIO_PEER_ID = 'radio_studio_live_room_123';
    const peer = new Peer(STUDIO_PEER_ID);
    let activeCall = null;

    peer.on('call', (call) => {
      // מענה אוטומטי לשיחה המגיעה מהמאזין
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        call.answer(stream);
        activeCall = call;

        call.on('stream', (remoteStream) => {
          const remoteAudio = document.getElementById('remoteAudio');
          remoteAudio.srcObject = remoteStream;
          remoteAudio.play();
        });
      });
    });

    function loadCallRequests() {
      const container = document.getElementById('callRequestsList');
      const requests = JSON.parse(localStorage.getItem('call_requests') || '[]');

      if (requests.length === 0 && !activeCall) {
        container.innerHTML = '<div style="color: var(--text-dim);">אין מאזינים הממתינים על הקו...</div>';
        return;
      }

      container.innerHTML = requests.map((req, idx) => `
        <div class="call-item">
          <div>
            <strong>${req.name}</strong> <small>(${req.time})</small>
          </div>
          <div>
            <button style="background: #10b981;" onclick="acceptCall('${req.id}', ${idx})">🟢 העלה לשידור</button>
            <button style="background: #ef4444;" onclick="disconnectCall(${idx})">🔴 נתק</button>
          </div>
        </div>
      `).join('');
    }

    function acceptCall(peerId, idx) {
      alert("המאזין מחובר כעת בלייב! הקול שלו מושמע באולפן.");
    }

    function disconnectCall(idx) {
      if (activeCall) {
        activeCall.close();
        activeCall = null;
      }
      let requests = JSON.parse(localStorage.getItem('call_requests') || '[]');
      requests.splice(idx, 1);
      localStorage.setItem('call_requests', JSON.stringify(requests));
      loadCallRequests();
    }

    setInterval(loadCallRequests, 2000);

    // --- אפקטים וקריין ---
    function speakAI() {
      const text = document.getElementById('aiText').value;
      if (!text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'he-IL';
      window.speechSynthesis.speak(u);
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const gain = audioCtx.createGain();
      gain.connect(audioCtx.destination);
      if (type === 'applause') {
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 1.5, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < buf.length; i++) d[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;
        noise.connect(gain);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
        noise.start(now);
      }
    }

    function loadMessages() {
      const msgList = document.getElementById('msgList');
      const messages = JSON.parse(localStorage.getItem('radio_messages') || '[]');
      msgList.innerHTML = messages.map(m => `
        <li class="msg-item"><strong>${m.name}</strong>: ${m.text}</li>
      `).join('');
    }
    setInterval(loadMessages, 3000);
    loadMessages();
  </script>
</body>
</html>
