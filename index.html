<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio DJ Studio - אולפן שידור</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-live: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .status-badge {
      background: #475569;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9em;
    }
    .status-badge.on-air { background: var(--accent-live); }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
    }
    h2 { margin-top: 0; color: #60a5fa; font-size: 1.2em; }
    
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.active { background: var(--danger); }

    .fx-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .fx-btn {
      background: #334155;
      padding: 15px;
      text-align: center;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    .msg-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 200px;
      overflow-y: auto;
    }
    .msg-item {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      border-right: 3px solid var(--accent);
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8em;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 style="margin:0; font-size: 1.5em;">📻 Radio DJ Studio - אולפן שידור</h1>
      <small style="color: var(--text-dim);">ניהול שידור חי, מיקרופון, אפקטים והודעות מאזינים</small>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
      <div id="clock" style="font-size: 1.2em; font-weight: bold;">00:00:00</div>
      <div id="airStatus" class="status-badge">OFF AIR 🔴</div>
      <button id="toggleStreamBtn" onclick="toggleMainStream()" style="background: var(--danger);">הפעל/כבה שידור ראשי</button>
    </div>
  </header>

  <div class="grid">
    
    <!-- בקרת מיקרופון ושידור -->
    <div class="card">
      <h2>🎙️ בקרת מיקרופון</h2>
      <button id="micBtn" onclick="toggleMicrophone()" style="width: 100%; padding: 15px; margin-bottom: 15px;">🎙️ דבר (מיקרופון כבוי)</button>
      <label>
        <input type="checkbox" id="duckingToggle" checked> הנמכה אוטומטית בדיבור (Ducking)
      </label>
    </div>

    <!-- קריין AI -->
    <div class="card">
      <h2>🎙️ קריין AI רדיופוני</h2>
      <textarea id="aiText" rows="3" placeholder="כתוב כאן מה שהקריין יגיד בלייב..."></textarea>
      <label style="font-size: 0.85em; color: var(--text-dim);">מהירות דיבור:</label>
      <input type="range" id="speechRate" min="0.5" max="1.5" step="0.1" value="1" style="width: 100%; margin-bottom: 10px;">
      <button onclick="speakAI()" style="width: 100%; background: #10b981;">🎙️ שדר כעת</button>
    </div>

    <!-- אפקטים קוליים -->
    <div class="card">
      <h2>👏 אפקטים וסצינות</h2>
      <div class="fx-grid">
        <button class="fx-btn" onclick="playSound('applause')">👏 מחיאות כפיים</button>
        <button class="fx-btn" onclick="playSound('jingle')">🎷 ג'ינגל פתיחה</button>
        <button class="fx-btn" onclick="playSound('laugh')">😄 צחוק קהל</button>
        <button class="fx-btn" onclick="playSound('siren')">📢 צפירת רדיו</button>
      </div>
    </div>

    <!-- נגן מוזיקה -->
    <div class="card">
      <h2>🎵 נגן מוזיקה ותור השמעה</h2>
      <input type="file" id="musicInput" multiple accept="audio/*" onchange="loadMusicFiles(this)" style="display:none;">
      <button onclick="document.getElementById('musicInput').click()" style="width:100%; margin-bottom: 10px;">➕ הוסף שירים לתור</button>
      <audio id="audioPlayer" controls style="width:100%; margin-bottom: 10px;"></audio>
      <label style="font-size: 0.85em; color: var(--text-dim);">עוצמת מוזיקה ברקע:</label>
      <input type="range" id="musicVol" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)" style="width: 100%;">
    </div>

    <!-- לוח הודעות מאזינים -->
    <div class="card" style="grid-column: span 2;">
      <h2>💬 הודעות מאזינים בלייב</h2>
      <button onclick="clearMessages()" style="background: #475569; font-size: 0.8em; margin-bottom: 10px;">ניקוי הודעות</button>
      <ul id="msgList" class="msg-list">
        <li style="color: var(--text-dim);">טוען הודעות...</li>
      </ul>
    </div>

  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    let isLive = false;
    let isMicOn = false;
    let micStream = null;
    const audioPlayer = document.getElementById('audioPlayer');

    async function toggleMicrophone() {
      const micBtn = document.getElementById('micBtn');
      const duckingEnabled = document.getElementById('duckingToggle').checked;

      if (!isMicOn) {
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          isMicOn = true;
          micBtn.innerText = "🎙️ מדבר כעת! (לחץ לכיבוי)";
          micBtn.classList.add("active");
          if (duckingEnabled) audioPlayer.volume = 0.2;
        } catch (err) { alert("לא ניתן לגשת למיקרופון"); }
      } else {
        if (micStream) micStream.getTracks().forEach(track => track.stop());
        isMicOn = false;
        micBtn.innerText = "🎙️ דבר (מיקרופון כבוי)";
        micBtn.classList.remove("active");
        if (duckingEnabled) audioPlayer.volume = document.getElementById('musicVol').value;
      }
    }

    function toggleMainStream() {
      isLive = !isLive;
      const statusBadge = document.getElementById('airStatus');
      const mainBtn = document.getElementById('toggleStreamBtn');
      if (isLive) {
        statusBadge.innerText = "ON AIR 🟢";
        statusBadge.classList.add("on-air");
        mainBtn.style.background = "#16a34a";
      } else {
        statusBadge.innerText = "OFF AIR 🔴";
        statusBadge.classList.remove("on-air");
        mainBtn.style.background = "#dc2626";
      }
    }

    function speakAI() {
      const text = document.getElementById('aiText').value;
      if (!text) return alert("הכנס טקסט לקריין");
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const hebrewVoice = voices.find(v => v.lang.includes('he'));
      if (hebrewVoice) utterance.voice = hebrewVoice;
      utterance.lang = 'he-IL';
      utterance.rate = document.getElementById('speechRate').value;
      window.speechSynthesis.speak(utterance);
    }

    // מנוע סאונד לאפקטים
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const gain = audioCtx.createGain();
      gain.connect(audioCtx.destination);

      if (type === 'applause') {
        const bufferSize = audioCtx.sampleRate * 1.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1000;
        noise.connect(filter);
        filter.connect(gain);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
        noise.start(now);
      } else if (type === 'jingle') {
        [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.frequency.value = freq;
          osc.connect(g);
          g.connect(audioCtx.destination);
          const st = now + idx * 0.15;
          g.gain.setValueAtTime(0.2, st);
          g.gain.exponentialRampToValueAtTime(0.001, st + 0.3);
          osc.start(st);
          osc.stop(st + 0.3);
        });
      } else if (type === 'siren') {
        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.3);
        osc.frequency.linearRampToValueAtTime(400, now + 0.6);
        osc.connect(gain);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      } else if (type === 'laugh') {
        for (let i = 0; i < 5; i++) {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.frequency.value = 300 + Math.random() * 100;
          osc.connect(g);
          g.connect(audioCtx.destination);
          const st = now + i * 0.12;
          g.gain.setValueAtTime(0.2, st);
          g.gain.exponentialRampToValueAtTime(0.01, st + 0.1);
          osc.start(st);
          osc.stop(st + 0.1);
        }
      }
    }

    // ניהול הודעות מאזינים
    function loadMessages() {
      const msgList = document.getElementById('msgList');
      const messages = JSON.parse(localStorage.getItem('radio_messages') || '[]');
      if (messages.length === 0) {
        msgList.innerHTML = '<li style="color: var(--text-dim);">אין הודעות חדשות...</li>';
        return;
      }
      msgList.innerHTML = messages.map(m => `
        <li class="msg-item">
          <div class="msg-header">
            <strong>${m.name}</strong>
            <span>${m.time}</span>
          </div>
          <div>${m.text}</div>
        </li>
      `).join('');
    }
    function clearMessages() {
      localStorage.removeItem('radio_messages');
      loadMessages();
    }
    setInterval(loadMessages, 3000);
    loadMessages();
  </script>
</body>
</html>
